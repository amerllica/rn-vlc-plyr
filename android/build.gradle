buildscript {
  ext.RnVlcPlyr = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return RnVlcPlyr[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def cxxSharedLibrary = "**/libc++_shared.so"
def sharedReactNativeLibraries = [
  "**/libfbjni.so",
  "**/libjsi.so",
  "**/libfolly_json.so",
  "**/libfolly_runtime.so",
  "**/libglog.so",
  "**/libhermes.so",
  "**/libhermes-executor-debug.so",
  "**/libhermes_executor.so",
  "**/libreactnative.so",
  "**/libreactnativejni.so",
  "**/libturbomodulejsijni.so",
  "**/libreact_nativemodule_core.so",
  "**/libjscexecutor.so"
]

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply from: '../nitrogen/generated/android/rnvlcplyr+autolinking.gradle'

apply plugin: "com.facebook.react"

react {
  jsRootDir = file("../src/")
}

android {
  namespace "com.margelo.nitro.rnvlcplyr"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += sharedReactNativeLibraries + [cxxSharedLibrary]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

androidComponents {
  onVariants(selector().all()) { variant ->
    def testJniLibs = variant.androidTest?.packaging?.jniLibs
    testJniLibs?.excludes?.set(sharedReactNativeLibraries)
    testJniLibs?.pickFirsts?.add(cxxSharedLibrary)
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "org.videolan.android:libvlc-all:3.7.7"

  testImplementation "junit:junit:4.13.2"

  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
